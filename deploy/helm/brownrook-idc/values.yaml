replicaCount: 2

image:
  repository: ghcr.io/larocquemb/brownrook-idc
  tag: "0.1.18"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

deployment:
  profile: portable
  clusterName: ""
  kubernetesVersion: ""
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30

build:
  gitCommit: unknown
  buildNumber: unknown

oidc:
  existingSecret: brownrook-idc-oidc
  tenantIdKey: tenant-id
  clientIdKey: client-id
  issuer: ""
  jwksUrl: ""
  audience: ""
  scope: ""

service:
  type: ClusterIP
  port: 80
  targetPort: http
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: idc.example.invalid
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 30

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsUser: 1001

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true
  allowSameNamespace: true
  ingressNamespaceSelector:
    matchLabels:
      network-policy.brownrook.com/idc-ingress: "true"
  allowedIngressCidrs: []
  dnsNamespace: kube-system
  allowedHttpsCidrs:
    - 0.0.0.0/0

topologySpread:
  enabled: true
  maxSkew: 1
  minDomains: 2
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  matchLabelKeys:
    - pod-template-hash

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
extraEnv: []
